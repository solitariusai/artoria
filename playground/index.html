<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artoria • Chess playground</title>
<style>
:root{color-scheme:dark;--bg:#192433;--panel:#243247;--ink:#edf2fa;--muted:#a9b8cc;--blue:#a6c8ff;--light:#bdcadb;--dark:#526885}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Trebuchet MS',sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font:normal 40px/1.1 Georgia,serif;margin:0}header p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(280px,640px) minmax(260px,1fr);gap:36px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:8px solid var(--panel);box-shadow:0 12px 36px #0003}.square{position:relative;border:0;border-radius:0;padding:0;display:grid;place-items:center;aspect-ratio:1;background:var(--light);cursor:pointer}.square.dark{background:var(--dark)}.piece{font:clamp(25px,5.5vw,60px)/1 'DejaVu Sans','Segoe UI Symbol',serif;pointer-events:none}.white-piece{color:#fff;text-shadow:0 1px 2px #000,1px 0 #000,-1px 0 #000}.black-piece{color:#172132;text-shadow:0 1px 1px #fff8}.square.selected{box-shadow:inset 0 0 0 5px #ffdc88}.square.target:after{content:'';position:absolute;width:22%;height:22%;border-radius:50%;background:#21304a99}.square.last{background:#91b2ca}.square.dark.last{background:#7398b1}.coord{position:absolute;bottom:2px;left:5px;font:11px 'Trebuchet MS';color:#172132}.controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button,input,textarea{font:inherit}button.control{background:var(--panel);color:var(--ink);border:1px solid #6a7c94;padding:8px 16px;border-radius:5px;cursor:pointer}button.control:hover{background:#354860}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid #ffdc88;outline-offset:2px}.status{min-height:26px;margin-top:14px;color:var(--blue)}aside{padding-top:4px}h2{font-size:18px;font-weight:normal;margin:0 0 10px}.score{font:52px/1.2 Georgia,serif;font-variant-numeric:tabular-nums}.caption{color:var(--muted);font-size:14px;margin:8px 0 20px}.balance{height:10px;background:#111b2a;border-radius:5px;overflow:hidden}.balance span{display:block;height:100%;background:#eaf1fb;width:50%;transition:width .25s}section{margin-bottom:28px}.moves{max-height:200px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;min-height:35px;color:var(--muted)}textarea{width:100%;min-height:92px;background:#111b2a;color:var(--ink);border:1px solid #60728a;border-radius:5px;padding:10px;font-size:13px;resize:vertical;overflow-wrap:anywhere}.error{color:#ffbcaa}dialog{background:var(--panel);color:var(--ink);border:1px solid #a9b8cc;border-radius:8px}dialog::backdrop{background:#0008}.promotion{display:flex;gap:8px}.promotion button{font-size:34px}.footer{font-size:13px;color:var(--muted);margin-top:24px}@media(max-width:760px){main{padding:24px 14px}header{display:block}header p{margin-top:8px}.layout{grid-template-columns:1fr;gap:24px}.piece{font-size:clamp(25px,8vw,60px)}aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}aside section:last-child{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main><header><h1>Artoria</h1><p>Play against your trained model.</p></header>
<div class="layout"><div><div id="board" class="board" role="group" aria-label="Chessboard"></div><div class="controls"><label for="side">Play as</label><select id="side" style="font:inherit;background:var(--panel);color:var(--ink);padding:8px;border-radius:5px"><option value="white">White</option><option value="black">Black</option><option value="both">Both sides / analysis</option></select><button class="control" id="undo">Undo turn</button><button class="control" id="reset">New game</button><button class="control" id="flip">Flip board</button></div><p id="status" class="status" role="status" aria-live="polite">Loading model evaluation…</p></div>
<aside><section><h2>Model evaluation</h2><div id="score" class="score">…</div><p class="caption">Pawns, from White’s perspective.<br>Positive favors White; negative favors Black.</p><div class="balance" aria-hidden="true"><span id="balance"></span></div><p id="context" class="caption"></p></section><section><h2>Moves</h2><div id="moves" class="moves"></div></section><section><label for="fen">Position / FEN</label><textarea id="fen" spellcheck="false"></textarea><div class="controls"><button id="load" class="control">Load position</button><button id="copy" class="control">Copy FEN</button></div><p class="caption">Loading a position starts a new game history.</p></section></aside></div><p id="info" class="footer"></p></main>
<dialog id="promotion"><p>Promote pawn to</p><div class="promotion"></div></dialog>
<script>
const $=id=>document.getElementById(id), initial='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const glyph={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let root=initial,moves=[],state=null,selected=null,flipped=false,busy=false;
function draw(){const board=$('board');board.replaceChildren();let last=moves.at(-1)||'';for(let i=0;i<64;i++){let f=flipped?7-i%8:i%8,r=flipped?Math.floor(i/8):7-Math.floor(i/8),sq=String.fromCharCode(97+f)+(r+1),p=state?.pieces[sq];let button=document.createElement('button');button.className='square'+((f+r)%2===0?' dark':'')+(selected===sq?' selected':'')+(last.slice(0,2)===sq||last.slice(2,4)===sq?' last':'');if(selected&&state?.legal_moves.some(m=>m.startsWith(selected+sq)))button.classList.add('target');button.setAttribute('aria-label',sq+(p?' '+({'p':'pawn','n':'knight','b':'bishop','r':'rook','q':'queen','k':'king'}[p.toLowerCase()])+' '+(p===p.toUpperCase()?'white':'black'):''));button.disabled=busy;button.onclick=()=>choose(sq);if(p){let span=document.createElement('span');span.className='piece '+(p===p.toUpperCase()?'white-piece':'black-piece');span.textContent=glyph[p];button.append(span)}if(i>=56||i%8===0){let label=document.createElement('span');label.className='coord';label.textContent=i>=56?String.fromCharCode(97+f):r+1;button.append(label)}board.append(button)}}
async function update(reply=true){
busy=true;selected=null;draw();const player=$('side').value;
$('status').classList.remove('error');$('status').textContent=reply&&player!=='both'?'Artoria is thinking…':'Evaluating…';
for(const id of ['undo','reset','load','side'])$(id).disabled=true;
try{
let response=await fetch(reply&&player!=='both'?'/api/play':'/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fen:root,moves,player})}),data=await response.json();
if(!response.ok)throw Error(data.error);state=data;moves=data.moves;
$('score').textContent=(data.score>=0?'+':'')+data.score.toFixed(2);$('balance').style.width=(50+45*Math.tanh(data.score/4))+'%';$('fen').value=data.fen;$('context').textContent=data.context+' / 128 positions in context';
$('status').textContent=data.result?data.result+' • '+data.termination:(player==='both'?data.turn+' to move':data.turn.toLowerCase()===player?'Your turn':'Artoria to move')+(data.check?' • Check':'');
$('info').textContent=data.checkpoint+' • Step '+data.step+' • '+(data.parameters/1e6).toFixed(2)+'M state elements';$('moves').replaceChildren();
const startsBlack=root.split(/\s+/)[1]==='b',startNumber=Number(root.split(/\s+/)[5]||1);
data.san.forEach((m,i)=>{let span=document.createElement('span'),ply=i+(startsBlack?1:0);span.textContent=(startNumber+Math.floor(ply/2))+(ply%2?'… ':'. ')+m;$('moves').append(span)});
if(!data.san.length)$('moves').textContent='Make a move to begin.';return true;
}catch(e){$('status').textContent=e.message;$('status').classList.add('error');return false}
finally{busy=false;for(const id of ['undo','reset','load','side'])$(id).disabled=false;const rootSide=root.split(/\s+/)[1]==='w'?'white':'black';$('undo').disabled=!moves.length||(player!=='both'&&player!==rootSide&&moves.length===1);draw()}}
async function choose(sq){
if(busy||!state||state.result)return;
const player=$('side').value;if(player!=='both'&&state.turn.toLowerCase()!==player)return;
let candidates=selected?state.legal_moves.filter(m=>m.startsWith(selected+sq)):[];
if(candidates.length){let move=candidates[0];if(candidates.length>1){move=await promote(candidates);if(!move)return}const old=moves.slice();moves.push(move);if(!await update()){moves=old;draw()}return}
const p=state.pieces[sq];selected=p&&(p===p.toUpperCase())===(state.turn==='White')?(selected===sq?null:sq):null;draw()}
function promote(candidates){return new Promise(resolve=>{const dialog=$('promotion'),container=dialog.querySelector('.promotion');container.replaceChildren();candidates.forEach(m=>{let b=document.createElement('button');b.className='control';b.textContent=glyph[state.turn==='White'?m[4].toUpperCase():m[4]];b.setAttribute('aria-label',{q:'Queen',r:'Rook',b:'Bishop',n:'Knight'}[m[4]]);b.onclick=()=>{dialog.close();resolve(m)};container.append(b)});dialog.oncancel=()=>resolve(null);dialog.showModal()})}
$('undo').onclick=async()=>{const old=moves.slice(),player=$('side').value;do{moves.pop()}while(moves.length&&player!=='both'&&((root.split(/\s+/)[1]==='w')!==(moves.length%2===1)?'white':'black')!==player);if(!await update(false)){moves=old;draw()}};
$('reset').onclick=async()=>{const old=[root,moves];root=initial;moves=[];if(!await update()){[root,moves]=old;draw()}};
$('side').onchange=()=>{flipped=$('side').value==='black';$('reset').click()};
$('flip').onclick=()=>{flipped=!flipped;draw()};
$('load').onclick=async()=>{const old=[root,moves];root=$('fen').value.trim();moves=[];if(!await update()){[root,moves]=old;draw()}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('fen').value);$('status').textContent='FEN copied.'}catch{$('fen').select();$('status').textContent='Select and copy the FEN.'}};update();
</script></html>
